<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1214">
<title>Toyota Hjawala 2027</title>
<style>
:root{color-scheme:dark;--amber:#ffb35c;--red:#ff5a3c;--green:#3ddc84;--glass:rgba(16,20,24,.46);--line:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1214;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
canvas{display:block}
#scene{position:fixed;inset:0}
svg{display:block}

/* ---------- شاشة التحميل ---------- */
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#222a2e,#0b0e10);text-align:center;padding:24px}
#loading .panel{width:min(340px,88vw)}
#loading .ttl{font-size:26px;font-weight:900;letter-spacing:2px}
#loading .ttl span{color:var(--amber)}
#loadText{margin:14px 0 4px;line-height:1.8;color:#e9e4da}
#progress{height:6px;background:#ffffff22;border-radius:8px;overflow:hidden;margin:14px 0}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--red));transition:width .25s}
#loading small{color:#9da4a8;line-height:1.8}
#loading.error{background:#2a1713}

/* ---------- واجهة القيادة ---------- */
#hud{position:fixed;inset:0;pointer-events:none;direction:ltr;text-shadow:0 2px 6px #000a}
#gauge{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));width:min(34vw,140px);aspect-ratio:1}
#gauge svg{width:100%;height:100%}
#gauge circle{fill:none;stroke-width:7;stroke-linecap:round}
#gauge .bg{fill:var(--glass);stroke:var(--line);stroke-width:1}
#gauge .trk{stroke:rgba(255,255,255,.16)}
.gnum{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.gnum b{font-size:clamp(28px,8.5vw,40px);font-weight:900;font-variant-numeric:tabular-nums}
.gnum small{font-size:10px;color:#cfd4d6;margin-top:3px;direction:rtl}
#gearBox{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--amber);letter-spacing:1px}
#rev{margin-top:8px;height:7px;border-radius:6px;background:var(--glass);border:1px solid var(--line);overflow:hidden;width:min(34vw,140px)}
#revFill{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ddc84,#ffd34d 65%,#ff4b3a)}
#hudLeft{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
#scoreCard{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));min-width:112px;padding:9px 13px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;direction:rtl}
#scoreCard .lbl{font-size:10px;color:#cfd4d6;letter-spacing:.5px}
#scoreCard .val{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
#scoreCard .best{font-size:10px;color:var(--amber);margin-top:2px}
#driftPop{position:absolute;top:34%;left:50%;transform:translate(-50%,0) scale(.92);text-align:center;opacity:0;transition:opacity .18s,transform .18s}
#driftPop.on{opacity:1;transform:translate(-50%,0) scale(1)}
#driftPop .t{font-size:13px;font-weight:900;letter-spacing:6px;color:var(--amber)}
#driftPop .p{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
#driftPop .m{font-size:15px;font-weight:800;color:#ffe0b0}
#bankPop{position:absolute;top:34%;left:50%;transform:translate(-50%,0);font-size:30px;font-weight:900;color:#7dffb0;opacity:0;white-space:nowrap}
#bankPop.show{animation:bank 1.3s ease-out}
@keyframes bank{0%{opacity:0;transform:translate(-50%,14px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.12)}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}

/* ---------- أزرار جانبية صغيرة ---------- */
#tools{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 84px);right:max(12px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.tool{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;padding:0}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool:active{background:rgba(255,179,92,.45)}

/* ---------- أزرار القيادة ---------- */
#controls{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-left));pointer-events:none;direction:ltr}
.group{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.btn{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:11px;touch-action:none;box-shadow:0 6px 18px #0006;transition:transform .06s,filter .06s}
.btn svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.btn.down{transform:scale(.93);filter:brightness(1.45)}
.steer{width:76px;height:76px;border-radius:24px}
.gas{width:86px;height:122px;border-radius:28px;background:linear-gradient(180deg,rgba(61,220,132,.62),rgba(20,110,70,.62));border-color:rgba(130,255,190,.6)}
.brake{width:74px;height:90px;border-radius:24px;background:linear-gradient(180deg,rgba(255,90,60,.62),rgba(140,40,30,.62));border-color:rgba(255,150,130,.6)}
.hand{width:66px;height:66px;border-radius:50%;background:linear-gradient(180deg,rgba(255,179,92,.6),rgba(160,90,20,.6));border-color:rgba(255,210,150,.6)}
@media(min-width:850px){.steer{width:88px;height:88px}.gas{width:98px;height:136px}.brake{width:84px;height:100px}.hand{width:76px;height:76px}}
</style>
</head>
<body>
<div id="scene"></div>

<div id="loading"><div class="panel">
 <div class="ttl">TOYOTA <span>HJAWALA</span></div>
 <div id="loadText">تحميل السيارة والطريق...</div>
 <div id="progress"><div id="bar"></div></div>
 <small>يرجى الانتظار حتى يكتمل تحميل ملفات المجسمات</small>
</div></div>

<div id="hud">
 <div id="hudLeft">
  <div id="gauge" style="position:relative;top:auto;left:auto">
   <svg viewBox="0 0 120 120">
    <defs><linearGradient id="gg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff5a3c"/></linearGradient></defs>
    <circle class="bg" cx="60" cy="60" r="57"/>
    <circle class="trk" cx="60" cy="60" r="47" transform="rotate(135 60 60)" stroke-dasharray="221.7 295.3"/>
    <circle id="arc" cx="60" cy="60" r="47" transform="rotate(135 60 60)" stroke-dasharray="0 295.3" stroke="url(#gg)"/>
   </svg>
   <div class="gnum"><b id="speed">0</b><small>كم/س</small></div>
   <div id="gearBox">GEAR <span id="gear">1</span></div>
  </div>
  <div id="rev"><i id="revFill"></i></div>
 </div>
 <div id="scoreCard"><div class="lbl">نقاط التفحيط</div><div class="val" id="score">0</div><div class="best">الأفضل: <span id="best">0</span></div></div>
 <div id="driftPop"><div class="t">DRIFT</div><div class="p" id="dpPts">0</div><div class="m" id="dpMul">x1.0</div></div>
 <div id="bankPop"></div>
 <div id="tools">
  <button class="tool" id="cam" title="تغيير الكاميرا"><svg viewBox="0 0 24 24"><path d="M3.5 8h3.2l1.8-2.2h7l1.8 2.2h3.2v11h-17z"/><circle cx="12" cy="13.2" r="3.4"/></svg></button>
  <button class="tool" id="reset" title="إعادة السيارة"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4.5v4h4"/></svg></button>
  <button class="tool" id="flip" title="قلب اتجاه السيارة"><svg viewBox="0 0 24 24"><path d="M6 8h12l-3-3"/><path d="M18 16H6l3 3"/></svg></button>
 </div>
</div>

<div id="controls">
 <div class="group">
  <div class="btn steer" data-control="left"><svg viewBox="0 0 24 24"><path d="M14.5 5l-7 7 7 7"/></svg></div>
  <div class="btn steer" data-control="right"><svg viewBox="0 0 24 24"><path d="M9.5 5l7 7-7 7"/></svg></div>
 </div>
 <div class="group">
  <div class="btn hand" data-control="hand">هاند</div>
  <div class="btn brake" data-control="brake"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>فرامل</div>
  <div class="btn gas" data-control="gas"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>بنزين</div>
 </div>
</div>

<!-- بدون هذا الـ importmap يفشل GLTFLoader ويبقى التحميل عند 0% -->
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<!-- كاشف أخطاء: يعرض سبب التوقف على شاشة التحميل -->
<script>
(function(){
 function showErr(m){
  var l=document.getElementById('loading'),t=document.getElementById('loadText');
  if(!l||l.style.display==='none')return;
  l.classList.add('error');if(t)t.textContent=m;
 }
 window.addEventListener('error',function(e){showErr('خطأ: '+(e.message||'غير معروف'));});
 window.addEventListener('unhandledrejection',function(e){showErr('خطأ: '+((e.reason&&e.reason.message)||e.reason));});
 setTimeout(function(){if(!window.__started)showErr('تعذر تشغيل اللعبة: تأكد من الإنترنت (مكتبة Three.js) أو حدّث المتصفح.');},9000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
window.__started=true;

/* ============ الإعدادات ============ */
const S=0.0325;                       // وحدة الملف ≈ 3.25 سم → السيارة ≈ 5.3 م
const ROAD_SIZE=16094392, CAR_SIZE=10467628;
// نقاط منتصف الطريق (من بيانات الملف) بإحداثيات المجسم الأصلية [x, z]
const CL_RAW=[[-958,4952],[-917,4663],[-882,4373],[-844,4084],[-811,3797],[-764,3487],[-707,3157],[-653,2834],[-599,2518],[-546,2230],[-486,1959],[-427,1657],[-376,1341],[-306,1048],[-224,772],[-136,478],[-58,159],[4,-160],[92,-482],[197,-786],[287,-1058],[379,-1330],[490,-1630],[586,-1950],[667,-2265],[773,-2562],[883,-2834],[980,-3123],[1083,-3446],[1188,-3761],[1264,-4054],[1320,-4348],[1369,-4656]];
const CL=CL_RAW.map(([x,z])=>({x:x*S,z:z*S}));
// إزاحة وصل نسخة الطريق بنهاية النسخة السابقة (محسوبة من أطراف الطريق) — طريق طويل متصل
const OFF={x:2393.7*S,y:343.7*S,z:-10017.8*S};
const N_COPIES=6;                     // 6 نسخ ≈ 1.9 كم
const START_K=1,START_IDX=2,LANE=3.0; // نسخة وموضع البداية، وبعد المسار الأيمن عن المنتصف (م)
const WB=1.54,TH=0.8;                 // نصف المسافة بين المحورين ونصف عرض العجلات (م)
const MAX_KMH=140;

const $=id=>document.getElementById(id);
const loading=$('loading'),loadText=$('loadText'),bar=$('bar');
const fail=m=>{loading.classList.add('error');loadText.textContent=m;bar.style.width='100%';};
const tick=()=>new Promise(r=>setTimeout(r,40));

/* ============ المشهد ============ */
const FOG=0xd7dde0;
const scene=new THREE.Scene();
scene.background=new THREE.Color(FOG);
scene.fog=new THREE.Fog(FOG,140,720);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
$('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdcecff,0x7a5c3a,1.5));
const sun=new THREE.DirectionalLight(0xffe0b0,2.2);
sun.position.set(-120,170,90);
scene.add(sun);

// سماء متدرجة بدل اللون الواحد
function makeSky(){
 const c=document.createElement('canvas');c.width=2;c.height=256;
 const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#2f6fb5');gr.addColorStop(.36,'#7fb2d8');gr.addColorStop(.49,'#d7dde0');gr.addColorStop(.56,'#ead9bd');gr.addColorStop(1,'#d9b88e');
 g.fillStyle=gr;g.fillRect(0,0,2,256);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
 const m=new THREE.Mesh(new THREE.SphereGeometry(900,24,16),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false,depthWrite:false,toneMapped:false}));
 m.renderOrder=-10;return m;
}
const sky=makeSky();scene.add(sky);

/* ============ شبكة الارتفاعات: سطح الطريق للسيارة ============ */
const CELL=0.6;
let G=null;
function buildGrid(root){
 const box=new THREE.Box3().setFromObject(root);
 const x0=box.min.x,z0=box.min.z;
 const w=Math.ceil((box.max.x-x0)/CELL)+2,h=Math.ceil((box.max.z-z0)/CELL)+2;
 const d=new Float32Array(w*h).fill(-1e9);
 const meshes=[];
 root.traverse(o=>{if(o.isMesh)meshes.push(o);});
 const prio=m=>/grass/i.test(m.material.name)?0:/side/i.test(m.material.name)?1:2;
 meshes.sort((a,b)=>prio(a)-prio(b));
 const v=new THREE.Vector3(),EPS=-1e-3;
 for(const mesh of meshes){
  const geo=mesh.geometry,pos=geo.attributes.position,n=pos.count,idx=geo.index;
  const V=new Float32Array(n*3);
  for(let i=0;i<n;i++){v.fromBufferAttribute(pos,i).applyMatrix4(mesh.matrixWorld);V[i*3]=v.x;V[i*3+1]=v.y;V[i*3+2]=v.z;}
  const tc=(idx?idx.count:n)/3;
  for(let t=0;t<tc;t++){
   const ia=idx?idx.getX(t*3):t*3,ib=idx?idx.getX(t*3+1):t*3+1,ic=idx?idx.getX(t*3+2):t*3+2;
   const ax=V[ia*3],ay=V[ia*3+1],az=V[ia*3+2],bx=V[ib*3],by=V[ib*3+1],bz=V[ib*3+2],cx=V[ic*3],cy=V[ic*3+1],cz=V[ic*3+2];
   const det=(bz-cz)*(ax-cx)+(cx-bx)*(az-cz);
   if(Math.abs(det)<1e-9)continue;
   const i0=Math.max(0,Math.floor((Math.min(ax,bx,cx)-x0)/CELL)),i1=Math.min(w-1,Math.ceil((Math.max(ax,bx,cx)-x0)/CELL));
   const j0=Math.max(0,Math.floor((Math.min(az,bz,cz)-z0)/CELL)),j1=Math.min(h-1,Math.ceil((Math.max(az,bz,cz)-z0)/CELL));
   for(let j=j0;j<=j1;j++){
    const pz=z0+j*CELL;
    for(let i=i0;i<=i1;i++){
     const px=x0+i*CELL;
     const l1=((bz-cz)*(px-cx)+(cx-bx)*(pz-cz))/det;
     const l2=((cz-az)*(px-cx)+(ax-cx)*(pz-cz))/det;
     const l3=1-l1-l2;
     if(l1>=EPS&&l2>=EPS&&l3>=EPS)d[j*w+i]=l1*ay+l2*by+l3*cy;
    }
   }
  }
 }
 G={x0,z0,w,h,d};
}
function gridY(x,z){
 const fx=(x-G.x0)/CELL,fz=(z-G.z0)/CELL,i=Math.floor(fx),j=Math.floor(fz);
 if(i<0||j<0||i>=G.w-1||j>=G.h-1)return NaN;
 const d=G.d,w=G.w,a=d[j*w+i],b=d[j*w+i+1],c=d[(j+1)*w+i],e=d[(j+1)*w+i+1];
 if(a>-1e8&&b>-1e8&&c>-1e8&&e>-1e8){
  const tx=fx-i,tz=fz-j;
  return (a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+e*tx)*tz;
 }
 let s=0,n=0;
 for(const q of [a,b,c,e])if(q>-1e8){s+=q;n++;}
 return n?s/n:NaN;
}
// الأرض عند (x,z) مع مراعاة نسخ الطريق المتكررة
function groundY(x,z){
 if(!G)return NaN;
 const k0=Math.round(z/OFF.z);
 for(const k of [k0,k0-1,k0+1]){
  if(k<0||k>=N_COPIES)continue;
  const h=gridY(x-OFF.x*k,z-OFF.z*k);
  if(!isNaN(h))return h+OFF.y*k;
 }
 return NaN;
}

/* ============ تجهيز الطريق والسيارة ============ */
const copies=[];
function prepareRoad(gltf){
 const root=gltf.scene;
 root.scale.setScalar(S);
 const aniso=Math.min(8,renderer.capabilities.getMaxAnisotropy());
 root.traverse(o=>{
  if(!o.isMesh)return;
  const m=o.material;m.side=THREE.DoubleSide;
  for(const k of ['map','metalnessMap','roughnessMap'])if(m[k])m[k].anisotropy=aniso;
 });
 root.updateMatrixWorld(true);
 buildGrid(root);                       // الشبكة تُبنى مرة واحدة وتُستخدم لكل النسخ
 for(let k=0;k<N_COPIES;k++){
  const c=k===0?root:root.clone(true);  // النسخ تتشارك نفس الهندسة والخامات (توفير ذاكرة)
  c.position.set(OFF.x*k,OFF.y*k,OFF.z*k);
  scene.add(c);copies.push(c);
 }
}
function makeBlob(){
 const c=document.createElement('canvas');c.width=c.height=128;
 const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,6,64,64,62);
 gr.addColorStop(0,'rgba(0,0,0,.85)');gr.addColorStop(.6,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');
 g.fillStyle=gr;g.fillRect(0,0,128,128);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(3.0,6.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4,fog:false}));
 m.rotation.x=-Math.PI/2;m.position.y=.05;m.renderOrder=1;
 return m;
}
let car=null,flip=null;
function prepareCar(gltf){
 const model=gltf.scene,dead=[];
 model.traverse(o=>{if(o.isLine||o.isLineSegments||o.isPoints)dead.push(o);});   // خطوط التحديد غير المرئية
 dead.forEach(o=>{if(o.geometry)o.geometry.dispose();if(o.parent)o.parent.remove(o);});
 model.traverse(o=>{
  if(!o.isMesh)return;
  const m=o.material;
  if(m.transparent){m.depthWrite=false;m.side=THREE.FrontSide;o.renderOrder=2;}
  else m.side=THREE.DoubleSide;
 });
 model.scale.setScalar(S);
 model.position.set(-43.7*S,1.516*S,103.35*S);   // المركز عند منتصف المحورين والإطارات على الأرض
 flip=new THREE.Group();flip.rotation.y=Math.PI;flip.add(model);   // المقدمة باتجاه -Z
 car=new THREE.Group();car.rotation.order='YXZ';
 car.add(flip);car.add(makeBlob());
 scene.add(car);
}

/* ============ مسار الطريق ============ */
function nearest(x,z){
 const k0=Math.round(z/OFF.z);let best=null;
 for(let k=k0-1;k<=k0+1;k++){
  const ox=OFF.x*k,oz=OFF.z*k;
  for(let i=0;i<CL.length-1;i++){
   const ax=CL[i].x+ox,az=CL[i].z+oz,dx=CL[i+1].x-CL[i].x,dz=CL[i+1].z-CL[i].z,l2=dx*dx+dz*dz;
   let t=((x-ax)*dx+(z-az)*dz)/l2;t=Math.max(0,Math.min(1,t));
   const cx=ax+dx*t,cz=az+dz*t,d2=(x-cx)*(x-cx)+(z-cz)*(z-cz);
   if(!best||d2<best.d2)best={k,i,d2,cx,cz,dx,dz,l:Math.sqrt(l2)};
  }
 }
 best.tx=best.dx/best.l;best.tz=best.dz/best.l;
 best.lat=(x-best.cx)*(-best.tz)+(z-best.cz)*best.tx;   // موجب = يمين الطريق
 best.dist=Math.sqrt(best.d2);
 return best;
}
const tangentAt=i=>{
 const a=CL[Math.max(0,i-1)],b=CL[Math.min(CL.length-1,i+1)];
 const dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz);return {x:dx/l,z:dz/l};
};
const headingOf=t=>Math.atan2(-t.x,-t.z);

/* ============ الحالة ============ */
const state={left:false,right:false,gas:false,brake:false,hand:false};
let speed=0,heading=0,sideVelocity=0,score=0,drift=0,driftT=0,best=0,camMode=0,camHead=0,pitchS=0,rollS=0,offTime=0,snap=true,firstGround=true,rpmS=.2;
try{best=parseInt(localStorage.getItem('hjawala_best')||'0',10)||0;}catch(_){}
const velocity=new THREE.Vector3(),fwd=new THREE.Vector3(),right=new THREE.Vector3(),followA=new THREE.Vector3(),lookAt=new THREE.Vector3(),clock=new THREE.Clock();

function placeCar(x,z,h){
 heading=h;camHead=h;sideVelocity=0;snap=true;firstGround=true;offTime=0;
 const y=groundY(x,z);
 car.position.set(x,isNaN(y)?0:y,z);
 car.rotation.set(0,h,0,'YXZ');pitchS=0;rollS=0;
}
function spawnAt(k,idx,lat){
 const t=tangentAt(idx),c=CL[idx];
 placeCar(c.x+OFF.x*k-t.z*lat,c.z+OFF.z*k+t.x*lat,headingOf(t));
}
// نقل السيارة والكاميرا عدة نسخ للأمام/الخلف: الطريق متطابق فلا يُلاحظ أي قفز
function shiftCopies(n){
 const dx=OFF.x*n,dy=OFF.y*n,dz=OFF.z*n;
 car.position.x+=dx;car.position.y+=dy;car.position.z+=dz;
 camera.position.x+=dx;camera.position.y+=dy;camera.position.z+=dz;
}

/* ============ التحكم ============ */
document.querySelectorAll('[data-control]').forEach(el=>{
 const k=el.dataset.control;
 const down=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}state[k]=true;el.classList.add('down');};
 const up=e=>{e.preventDefault();state[k]=false;el.classList.remove('down');};
 el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
 el.addEventListener('contextmenu',e=>e.preventDefault());
});
const keyMap=e=>{
 const k=e.key.toLowerCase();
 if(e.key==='ArrowLeft'||k==='a')return 'left';
 if(e.key==='ArrowRight'||k==='d')return 'right';
 if(e.key==='ArrowUp'||k==='w')return 'gas';
 if(e.key==='ArrowDown'||k==='s')return 'brake';
 if(e.code==='Space')return 'hand';
 return null;
};
addEventListener('keydown',e=>{const k=keyMap(e);if(k){state[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{const k=keyMap(e);if(k){state[k]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in state)state[k]=false;});
$('reset').onclick=()=>{if(!car)return;speed=0;score=0;drift=0;driftT=0;spawnAt(START_K,START_IDX,LANE);};
$('flip').onclick=()=>{if(flip)flip.rotation.y+=Math.PI;};
$('cam').onclick=()=>{camMode=(camMode+1)%3;};
const CAMS=[{back:11,up:4.6},{back:17,up:7},{back:7,up:2.6}];

/* ============ الواجهة ============ */
const el={speed:$('speed'),arc:$('arc'),gear:$('gear'),rev:$('revFill'),score:$('score'),best:$('best'),dp:$('driftPop'),dpPts:$('dpPts'),dpMul:$('dpMul'),bank:$('bankPop')};
const last={speed:-1,score:-1,gear:'',best:-1};
const GEARS=[0,28,52,78,105,140];
function showBank(p){
 el.bank.textContent='+'+Math.floor(p).toLocaleString('en-US');
 el.bank.classList.remove('show');void el.bank.offsetWidth;el.bank.classList.add('show');
}
function updateHud(kmh,reverse,dt){
 const k=Math.round(kmh);
 if(k!==last.speed){
  el.speed.textContent=k;last.speed=k;
  el.arc.setAttribute('stroke-dasharray',(Math.min(1,kmh/MAX_KMH)*221.7).toFixed(1)+' 295.3');
 }
 let g=1;for(let i=1;i<GEARS.length-1;i++)if(kmh>=GEARS[i])g=i+1;
 const gs=reverse?'R':String(g);
 if(gs!==last.gear){el.gear.textContent=gs;last.gear=gs;}
 const lo=GEARS[g-1],hi=GEARS[g];
 const target=kmh<1?(.2+(state.gas?.18:0)):.28+.66*Math.min(1,(kmh-lo)/(hi-lo));
 rpmS+=(target-rpmS)*(1-Math.exp(-9*dt));
 el.rev.style.width=Math.round(Math.min(1,rpmS)*100)+'%';
 const sc=Math.floor(score+drift);
 if(sc!==last.score){el.score.textContent=sc.toLocaleString('en-US');last.score=sc;}
 if(best!==last.best){el.best.textContent=best.toLocaleString('en-US');last.best=best;}
}

/* ============ حلقة اللعبة ============ */
const wheelY=(px,pz,f,l)=>groundY(px+fwd.x*f+right.x*l,pz+fwd.z*f+right.z*l);
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 // --- القيادة (فيزياء مؤقتة؛ نطورها في المرحلة 3) ---
 const steer=(state.left?1:0)-(state.right?1:0);
 if(state.gas)speed+=13.5*dt;
 if(state.brake)speed-=22*dt;
 speed*=Math.pow(state.hand?.992:.997,dt*60);
 speed*=Math.pow(.999,dt*60);
 speed=THREE.MathUtils.clamp(speed,-8,38);
 const grip=state.hand?.975:.88;
 const steerFactor=THREE.MathUtils.clamp(Math.abs(speed)/7,.12,1);
 heading+=steer*steerFactor*(state.hand?1.7:1.15)*dt*Math.sign(speed||1);
 fwd.set(-Math.sin(heading),0,-Math.cos(heading));
 right.set(Math.cos(heading),0,-Math.sin(heading));
 const desiredSide=state.hand?steer*Math.abs(speed)*.24:steer*Math.abs(speed)*.035;
 sideVelocity=THREE.MathUtils.lerp(sideVelocity,desiredSide,1-Math.pow(grip,dt*60));
 velocity.copy(fwd).multiplyScalar(speed).addScaledVector(right,sideVelocity);
 car.position.addScaledVector(velocity,dt);

 // --- التصاق السيارة بسطح الطريق ---
 const px=car.position.x,pz=car.position.z;
 const hs=[wheelY(px,pz,WB,-TH),wheelY(px,pz,WB,TH),wheelY(px,pz,-WB,-TH),wheelY(px,pz,-WB,TH)];
 const valid=hs.filter(v=>!isNaN(v));
 if(valid.length){
  offTime=0;
  const mean=valid.reduce((a,b)=>a+b,0)/valid.length;
  const [FL,FR,RL,RR]=hs.map(v=>isNaN(v)?mean:v);
  const y=(FL+FR+RL+RR)/4;
  const pitch=Math.atan2((FL+FR)/2-(RL+RR)/2,2*WB);
  const roll=Math.atan2((FR+RR)/2-(FL+RL)/2,2*TH);
  if(firstGround){car.position.y=y;pitchS=pitch;rollS=roll;firstGround=false;}
  else{
   const kt=1-Math.exp(-10*dt);
   pitchS+=(pitch-pitchS)*kt;rollS+=(roll-rollS)*kt;
   car.position.y+=(y-car.position.y)*(1-Math.exp(-25*dt));
  }
 }else offTime+=dt;
 car.rotation.set(pitchS,heading,rollS,'YXZ');

 // --- مراقبة المسار: تكرار الطريق، واسترجاع السيارة لو خرجت عنه ---
 const nr=nearest(car.position.x,car.position.z);
 if(nr.k>=4){shiftCopies(-2);nr.k-=2;}
 else if(nr.k<=0){shiftCopies(2);nr.k+=2;}
 else if(nr.dist>14||offTime>.8){
  speed*=.4;
  spawnAt(nr.k,Math.max(1,Math.min(CL.length-4,nr.i)),LANE);
 }
 for(let k=0;k<copies.length;k++)copies[k].visible=Math.abs(k-nr.k)<=2;   // نرسم النسخ القريبة فقط

 // --- نقاط التفحيط ---
 const drifting=state.hand&&Math.abs(speed)>5&&Math.abs(steer)>.05;
 if(drifting){
  driftT+=dt;
  const mult=1+Math.min(4,driftT/2);
  drift+=dt*Math.abs(speed)*2.1*mult;
  el.dp.classList.add('on');
  el.dpPts.textContent=Math.floor(drift).toLocaleString('en-US');
  el.dpMul.textContent='x'+mult.toFixed(1);
 }else if(drift>0||driftT>0){
  el.dp.classList.remove('on');
  if(drift>=30){
   score+=drift;showBank(drift);
   if(score>best){best=Math.floor(score);try{localStorage.setItem('hjawala_best',String(best));}catch(_){}}
  }
  drift=0;driftT=0;
 }
 updateHud(Math.abs(speed)*3.6,speed<-.5,dt);

 // --- الكاميرا: تتبع بتأخر، وتوسيع زاوية الرؤية مع السرعة ---
 let dh=heading-camHead;dh=Math.atan2(Math.sin(dh),Math.cos(dh));
 camHead+=dh*(1-Math.exp(-5*dt));
 const cm=CAMS[camMode];
 followA.set(car.position.x+Math.sin(camHead)*cm.back,car.position.y+cm.up,car.position.z+Math.cos(camHead)*cm.back);
 const gg=groundY(followA.x,followA.z);
 if(!isNaN(gg))followA.y=Math.max(followA.y,gg+1.3);
 if(snap){camera.position.copy(followA);snap=false;}
 else camera.position.lerp(followA,1-Math.exp(-8*dt));
 lookAt.set(car.position.x-Math.sin(camHead)*2,car.position.y+1.2,car.position.z-Math.cos(camHead)*2);
 camera.lookAt(lookAt);
 const fovT=62+Math.min(1,Math.abs(speed)/38)*13;
 if(Math.abs(fovT-camera.fov)>.05){camera.fov+=(fovT-camera.fov)*(1-Math.exp(-4*dt));camera.updateProjectionMatrix();}
 sky.position.copy(camera.position);

 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

/* ============ التحميل ============ */
const loader=new GLTFLoader();
let roadPct=0,carPct=0;
const setBar=()=>{bar.style.width=Math.round((roadPct*ROAD_SIZE+carPct*CAR_SIZE)/(ROAD_SIZE+CAR_SIZE)*90)+'%';};
const loadGLB=(url,name,size,setP)=>new Promise((res,rej)=>{
 loader.load(url,res,x=>{setP(Math.min(1,x.loaded/size));setBar();},e=>rej(new Error(name+': '+((e&&e.message)||'تعذر التحميل'))));
});
(async()=>{
 try{
  const [roadGltf,carGltf]=await Promise.all([
   loadGLB('./assets/american_road.glb','الطريق',ROAD_SIZE,p=>roadPct=p),
   loadGLB('./assets/toyota_hilux.glb','السيارة',CAR_SIZE,p=>carPct=p)
  ]);
  loadText.textContent='جاري تجهيز الطريق...';bar.style.width='92%';await tick();
  prepareRoad(roadGltf);
  loadText.textContent='جاري تجهيز السيارة...';bar.style.width='97%';await tick();
  prepareCar(carGltf);
  spawnAt(START_K,START_IDX,LANE);
  loadText.textContent='اكتمل التحميل';bar.style.width='100%';
  animate();
  setTimeout(()=>loading.style.display='none',400);
 }catch(e){
  console.error(e);
  fail('تعذر تحميل اللعبة — '+((e&&e.message)||e)+' (تأكد أن الملفات داخل مجلد assets)');
 }
})();
</script>
